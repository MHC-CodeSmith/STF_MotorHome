limits:
  - Nenhum R(SOC,T), OCV, entropia, capacidade térmica, UA ou limiteBMS foi medido no packOEM.
  - Massa650kg não deve ser adicionada à tara2790kg OEM; usada somente na sensibilidade térmica.
  - Modelo de duas temperaturas concentradas; não campo de células nem eletroquímica PyBaMM executada.
  - Corrente positiva significa carga; calor reversível +I*T*dUoc/dT nesta convenção.
  - Potência é entregue aos terminais do pack; perdas do carregador externo não aquecem automaticamente o pack.
  - SOC20–80% é protocolo proposto; professor especifica potência, não esse intervalo.
  - Proteções250A/450V/45°C são limites hipotéticos; não aprovação OEM.
  - Refrigeração é dissipação para25°C por UA assumido, sem chiller abaixo do ambiente.
