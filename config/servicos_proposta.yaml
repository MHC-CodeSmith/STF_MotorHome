load_dispatch:
  - Priorizar serviços essenciais e reservar energia útil de habitação.
  - Intertravar carga OEM, secagem e indução conforme potência/VA e limites reais dos aparelhos e do BMS.
  - Geração da camada inferior recolhida não é creditada; sombreada pela camada superior.
  - Barramentos12/48V são diferentes; soma energética do estudo solar é potencial agregado, sem garantia de transferência entre eles.
