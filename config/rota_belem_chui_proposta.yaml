limits:
  - Rota roteada sobreOpenStreetMap, sem inspeção local de circulação, altura, peso, estacionamento ou condição de pavimento.
  - Limites aproximados por classe e perfil de tempo OSRM; placas reais continuam autoridade na condução.
  - RelevoDEM5km suaviza rampas locais, pontes e túneis; não valida potência de pico.
  - ClimaERA5 em nós esparsos aproxima nuvens/temperatura; não é medição a bordo nem previsão.
  - Interface de cargaOEM e mapas de eficiência continuam hipóteses.
  - Política construtiva com recolhimento e condução noturna; sem certificado de mínimo global.
  - Paradas na coordenada de progresso não identificam estacionamento legal/seguro com área para painéis.
