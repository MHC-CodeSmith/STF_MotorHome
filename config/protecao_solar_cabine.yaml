# Item 32: proteção solar interna do para-brisa com o veículo parado.
# O ganho pelo para-brisa domina a carga do I32 (sol do meio-dia de 21/06 em São Carlos
# na face frontal, orientação 0°). Com a cortina fechada, o ganho pelo vidro é
# multiplicado pelo coeficiente de atenuação interna (IAC = SHGC com proteção / SHGC sem).
device:
  model: Remis REMIfront IV (para-brisa, Fiat Ducato série 8, 2021+)
  type: cortina plissada refletiva interna, trilho próprio nas colunas A, fecho magnético
  url: https://www.reimo.com/en/camping-shop/van-windows-caravan-windows-camper-windows-blinds-vents/cab-blinds-side-window-blinds-remifront/67134/remifront-iv-front-window-blind-ducato-2021-s8-large-sensors?c=1060
  accessed: '2026-11-23'
  mass_note: coberta pelos 12,0 kg de proteções solares e arremates do inventário de janelas (I16/I18)
  status: hipotese_de_projeto
iac:
  nominal: 0.5
  sweep: [0.3, 0.4, 0.5, 0.6, 0.7]
  source: >-
    ASHRAE Handbook - Fundamentals (2009), cap. 15, tabelas de IAC para persianas e
    cortinas internas claras/refletivas; faixa adotada de forma conservadora, sem ensaio
    do produto.
operation: >-
  Fechada com o veículo parado ao meio-dia. Na missão do I29 o deslocamento começa às
  17h45, portanto o meio-dia é sempre de veículo parado. Em movimento o para-brisa fica
  livre e a carga volta ao caso sem proteção.
capacity_claim_w: 2700
