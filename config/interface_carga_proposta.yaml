  - Tensão230V de saída vs aparelhos220V requer faixas admissíveis, não supor compatibilidade.
  - Eficiências e fatores de potência são sensibilidades, sem curvas de carga medidas.
  - Potências contínuas e perfis não verificam corrente de partida, harmônicos ou térmica do armário.
  - MassaEVSE não foi incorporada à BOM final; cabos/adaptadores/proteções adicionais ainda sem massa/custo.
